name: Deploy to Namecheap (SFTP)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy via SFTP (rsync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.SFTP_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files with rsync
        run: |
          rsync -avz --delete --exclude='.git' --exclude='.github' --exclude='node_modules' ./ ${{ secrets.SFTP_USERNAME }}@${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_REMOTE_PATH }}

# Notes:
# - Add the secrets `SFTP_HOST`, `SFTP_USERNAME`, `SFTP_PRIVATE_KEY`, and `SFTP_REMOTE_PATH` in your GitHub repository settings.
# - Ensure your hosting account allows SSH/SFTP access and the key is authorized.
