name: Deploy to GO54 via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync to server (FTP) using lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "Starting lftp mirror to $FTP_HOST:$FTP_SERVER_DIR"
          # ensure directory exists on remote and mirror local -> remote
          # Use passive mode, continue partial transfers, run 4 parallel streams and exclude large folders
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:list-options -a; set ftp:passive-mode on; set ssl:verify-certificate no; mirror -R --verbose --delete --continue --parallel=4 \
            --exclude-glob .git* \
            --exclude-glob .github \
            --exclude-glob node_modules \
            --exclude-glob .env \
            --exclude-glob wp-content/uploads \
            --exclude-glob wp-content/plugins \
            --exclude-glob wp-content/cache \
            ./ $FTP_SERVER_DIR; quit"

