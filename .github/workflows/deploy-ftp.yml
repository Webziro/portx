name: Deploy to Namecheap (FTP)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to server (FTP)
        uses: SamKirkland/FTP-Deploy-Action@4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: './'
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            .git*
            .github/*
            node_modules
            .env
          passive: true
          log-level: info

# Notes:
# - Add the secrets `FTP_HOST`, `FTP_USERNAME`, `FTP_PASSWORD`, and `FTP_SERVER_DIR` in your GitHub repository settings.
# - This workflow runs on pushes to `main`. Adjust branch as needed.
