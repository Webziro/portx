name: Deploy to GO54 via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync to server (FTP) using lftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "Starting lftp mirror to $FTP_HOST:$FTP_SERVER_DIR"
          # ensure directory exists on remote and mirror local -> remote
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "set ftp:list-options -a; set ssl:verify-certificate no; mirror -R --verbose --delete --exclude-glob .git* --exclude-glob .github --exclude-glob node_modules --exclude-glob .env ./ $FTP_SERVER_DIR; quit"

